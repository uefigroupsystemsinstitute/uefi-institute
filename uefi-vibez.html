<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeZ - Immersive Feed</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. CORE & RESET
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        
        /* ==========================================================================
           2. FEED & VIDEO CONTAINERS
           ========================================================================== */
        #feed-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
            position: relative;
        }
        #feed-container::-webkit-scrollbar { display: none; }
        #feed-container.no-scroll { overflow-y: hidden; }

        .video-container {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .yt-iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; /* Crucial: Allows double tap on overlay */
            opacity: 0;
            transition: opacity 0.5s ease;
            object-fit: cover;
        }

        /* The invisible layer that catches clicks/touches */
        .interaction-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
        }

        /* ==========================================================================
           3. UI OVERLAYS (TikTok Style)
           ========================================================================== */
        .ui-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none; /* Let clicks pass through except for buttons */
        }

        .video-info { flex: 1; padding-right: 20px; pointer-events: auto; }
        .author-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 5px; display: flex; align-items: center; gap: 5px;}
        .verified-badge { color: #00e676; font-size: 0.9rem; }
        .video-desc { font-size: 0.9rem; margin-bottom: 10px; line-height: 1.3; }
        .tags { color: #00ffcc; font-weight: 600; }
        .music-ticker { font-size: 0.8rem; display: flex; align-items: center; gap: 8px; animation: ticker 4s linear infinite; }

        @keyframes ticker {
            0% { transform: translateX(10%); }
            100% { transform: translateX(-10%); }
        }

        .side-actions { display: flex; flex-direction: column; gap: 20px; align-items: center; pointer-events: auto; }
        .action-btn { background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .action-btn span { font-size: 0.75rem; font-weight: 600; }
        .action-btn:hover { transform: scale(1.1); }
        .like-btn.liked i { color: #ff007f; animation: pulse 0.3s ease; }
        
        .profile-pic { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #fff; margin-bottom: 10px; object-fit: cover;}

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Floating Hearts Animation */
        .floating-heart {
            position: absolute;
            color: #ff007f;
            font-size: 4rem;
            transform: translate(-50%, -50%) scale(0);
            animation: floatUp 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 10px rgba(255,0,127,0.5);
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50% { transform: translate(-50%, -100%) scale(1.2); opacity: 0.8; }
            100% { transform: translate(-50%, -200%) scale(1); opacity: 0; }
        }

        /* ==========================================================================
           4. MODALS (Quiz & Diary) - Glassmorphism
           ========================================================================== */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            z-index: 100; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal.open { display: flex; opacity: 1; }
        
        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 30px; border-radius: 20px;
            width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* Quiz Specifics */
        .quiz-title { font-size: 1.5rem; font-weight: 800; color: #00ffcc; margin-bottom: 15px; }
        #quiz-q-text { font-size: 1.1rem; margin-bottom: 25px; }
        .quiz-btn {
            width: 100%; padding: 12px; margin: 8px 0;
            background: rgba(255,255,255,0.05); color: #fff;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
        }
        .quiz-btn:hover { background: rgba(255,255,255,0.15); }
        .quiz-btn.correct { background: #00e676; border-color: #00e676; color: #000; }
        .quiz-btn.wrong { background: #ff007f; border-color: #ff007f; color: #fff; animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .explanation { margin-top: 20px; font-size: 0.9rem; color: #ddd; display: none; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; border-left: 3px solid #00ffcc; }
        .continue-btn { margin-top: 20px; width: 100%; padding: 12px; background: #00ffcc; color: #000; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; display: none; text-transform: uppercase; }

        /* Diary Specifics */
        .diary-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .diary-upload { position: relative; cursor: pointer; }
        .diary-upload img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00ffcc; object-fit: cover; }
        .diary-upload i { position: absolute; bottom: 0; right: 0; background: #00ffcc; color: #000; border-radius: 50%; padding: 4px; font-size: 0.7rem; }
        .diary-name-input { background: none; border: none; border-bottom: 2px solid rgba(255,255,255,0.2); color: #fff; font-size: 1.2rem; font-weight: 600; outline: none; width: 100%; padding: 5px; transition: border-color 0.3s; }
        .diary-name-input:focus { border-bottom-color: #00ffcc; }
        .diary-textarea { width: 100%; height: 150px; background: rgba(0,0,0,0.3); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 15px; font-size: 1rem; resize: none; outline: none; margin-bottom: 15px; }
        .diary-textarea:focus { border-color: #00ffcc; }
        .emoji-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .emoji-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s; }
        .emoji-btn:hover { transform: scale(1.2); }
        .close-diary-btn { width: 100%; padding: 12px; background: #fff; color: #000; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase;}

        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; display: none; }
        
        /* Loading Screen */
        #loader { position: fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #00ffcc; }
        .spinner { border: 4px solid rgba(0, 255, 204, 0.2); border-top: 4px solid #00ffcc; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    
    <!-- Load YouTube IFrame API properly -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <!-- App Initialization Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <h2>Initializing VibeZ...</h2>
    </div>

    <canvas id="confetti-canvas"></canvas>
    
    <!-- Audio for Success -->
    <audio id="success-sound" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" preload="auto"></audio>

    <div id="feed-container">
        <!-- Videos will be injected here via JavaScript -->
    </div>

    <!-- Quiz Interceptor Modal -->
    <div id="quiz-modal" class="modal">
        <div class="modal-content">
            <div class="quiz-title"><i class="fas fa-brain"></i> Mind Check</div>
            <div id="quiz-q-text">Loading question...</div>
            <div id="quiz-options-container"></div>
            <div class="explanation" id="quiz-explanation">
                <strong>Insight:</strong> <span id="exp-text-content"></span>
            </div>
            <button class="continue-btn" id="continue-scroll-btn" onclick="resumeScrolling()">Keep Scrolling <i class="fas fa-arrow-down"></i></button>
        </div>
    </div>

    <!-- Diary Vault Modal -->
    <div id="diary-modal" class="modal">
        <div class="modal-content" style="background: rgba(20,20,30,0.9);">
            <h3 style="color: #fff; margin-bottom: 20px;"><i class="fas fa-book-open"></i> Your Vault</h3>
            <div class="diary-header">
                <label class="diary-upload">
                    <img id="diary-img" src="https://i.pravatar.cc/150?img=11" alt="Profile">
                    <i class="fas fa-camera"></i>
                    <input type="file" style="display: none;" accept="image/*" onchange="uploadDiaryImage(event)">
                </label>
                <input type="text" id="diary-name" class="diary-name-input" placeholder="Enter your name...">
            </div>
            <textarea id="diary-notes" class="diary-textarea" placeholder="Scribe your thoughts, goals, or lessons learned today..."></textarea>
            <div class="emoji-bar">
                <button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="addEmoji('💡')">💡</button>
                <button class="emoji-btn" onclick="addEmoji('🚀')">🚀</button>
                <button class="emoji-btn" onclick="addEmoji('🧘‍♂️')">🧘‍♂️</button>
                <button class="emoji-btn" onclick="addEmoji('💯')">💯</button>
            </div>
            <button class="close-diary-btn" onclick="toggleDiary()">Save & Close</button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           0. DATA CONFIGURATION & STATE
           ========================================================================== */
        // Use YouTube Shorts video IDs here
        const videoDB = [
            { id: '1sX4q6K74YI', author: 'MotivationHub', cat: 'Mindset' },
            { id: 'dQw4w9WgXcQ', author: 'Rick Astley', cat: 'Music' }, // Classic test video
            { id: '3JZ_D3ELwOQ', author: 'TechGuru', cat: 'Tech' },
            { id: 'V-_O7nl0Ii0', author: 'FitnessPro', cat: 'Health' },
            { id: '9bZkp7q19f0', author: 'PsycheVault', cat: 'Psychology' }
        ];

        const quizDatabase = [
            { q: "Information without execution is useless. What is your immediate next step?", opts: ["Apply what I learned", "Keep scrolling endlessly", "Close the app"], ans: 0, exp: "Action is the ultimate currency. Scribe your plan into your Diary." },
            { q: "Focus is built by eliminating distractions. What is the biggest distraction?", opts: ["My environment", "My smartphone", "My lack of discipline"], ans: 2, exp: "Discipline dictates focus. External tools only amplify internal habits." },
            { q: "Growth happens outside your comfort zone. Are you uncomfortable yet?", opts: ["Yes, I'm pushing limits", "No, I'm playing it safe", "I don't know"], ans: 0, exp: "Embrace the struggle. That is where character is built." }
        ];

        let activeQuizPool = [...quizDatabase];
        let playerRegistry = {};
        let videosWatched = 0;
        let isInterceptorActive = false;
        let currentlyPlayingId = null;

        /* ==========================================================================
           1. INITIALIZATION
           ========================================================================== */
        function initApp() {
            // Hide Loader
            document.getElementById('loader').style.display = 'none';

            generateFeed();
            setupIntersectionObserver();
            initDoubleTapLike();
            loadDiaryData();
        }

        /* YouTube API Callback */
        window.onYouTubeIframeAPIReady = function() {
            // YouTube library loaded successfully
            initApp();
        };

        /* ==========================================================================
           2. FEED GENERATION
           ========================================================================== */
        function generateFeed() {
            const feed = document.getElementById('feed-container');
            
            // Loop through videos to create the UI elements
            videoDB.forEach((vid, index) => {
                const container = document.createElement('div');
                container.className = 'video-container';
                container.id = `wrapper-${vid.id}-${index}`;

                // Using standard YouTube embed with params optimized for background/shorts
                const playerHtml = `
                    <div id="player-wrapper-${vid.id}-${index}" style="width:100%; height:100%;">
                        <div id="player-${vid.id}-${index}" class="yt-iframe"></div>
                    </div>
                `;

                container.innerHTML = `
                    ${playerHtml}
                    <!-- Interaction layer to catch swipes and taps over the iframe -->
                    <div class="interaction-layer"></div>
                    
                    <div class="ui-overlay">
                        <div class="video-info">
                            <div class="author-name">@${vid.author} <i class="fas fa-check-circle verified-badge"></i></div>
                            <div class="video-desc">Master your craft daily. <span class="tags">#${vid.cat.toLowerCase()} #vibeZ</span></div>
                            <div class="music-ticker"><i class="fas fa-compact-disc"></i> Original Audio - VibeZ Vault</div>
                        </div>
                        <div class="side-actions">
                            <img src="https://i.pravatar.cc/150?u=${vid.author}" class="profile-pic" alt="Creator">
                            <button class="action-btn like-btn"><i class="fas fa-heart"></i><span>Like</span></button>
                            <button class="action-btn" onclick="toggleDiary()"><i class="fas fa-book-open"></i><span>Diary</span></button>
                            <button class="action-btn"><i class="fas fa-share"></i><span>Share</span></button>
                        </div>
                    </div>
                `;
                feed.appendChild(container);
            });
            feed.scrollTop = 0;
        }

        /* ==========================================================================
           3. LAZY LOADING & VIDEO OBSERVER (Autoplay Logic)
           ========================================================================== */
        function setupIntersectionObserver() {
            const feed = document.getElementById('feed-container');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const containerId = entry.target.id; 
                    const parts = containerId.split('-');
                    const videoId = parts[1];
                    const idx = parts[2];
                    const playerId = `player-${videoId}-${idx}`;
                    const wrapperId = `player-wrapper-${videoId}-${idx}`;

                    if (entry.isIntersecting) {
                        // If player doesn't exist, create it
                        if (!playerRegistry[playerId]) {
                            playerRegistry[playerId] = new YT.Player(playerId, {
                                videoId: videoId,
                                playerVars: {
                                    'autoplay': 1, 'controls': 0, 'rel': 0, 'showinfo': 0, 
                                    'modestbranding': 1, 'loop': 1, 'playlist': videoId,
                                    'playsinline': 1, 'mute': 0, 'disablekb': 1, 'fs': 0
                                },
                                events: {
                                    'onReady': (e) => {
                                        const wrapper = document.querySelector(`#${playerId}`);
                                        if(wrapper) wrapper.style.opacity = '1';
                                        
                                        // Attempt to play (Browser policies might require mute if no user interaction yet)
                                        e.target.playVideo();
                                    },
                                    'onStateChange': (e) => {
                                        // Loop fallback if API playlist fails
                                        if (e.data === YT.PlayerState.ENDED) {
                                            e.target.playVideo();
                                        }
                                    }
                                }
                            });
                        } else {
                            // Resume if already loaded
                            if(typeof playerRegistry[playerId].playVideo === 'function'){
                                playerRegistry[playerId].playVideo();
                            }
                        }
                        
                        currentlyPlayingId = playerId;
                        videosWatched++;
                        
                        // Trigger Interceptor Quiz every 3 videos
                        if (videosWatched > 1 && (videosWatched - 1) % 3 === 0 && !isInterceptorActive) {
                            setTimeout(() => launchInterceptorQuiz(), 1200); 
                        }

                    } else {
                        // Pause video when out of view
                        if (playerRegistry[playerId] && typeof playerRegistry[playerId].pauseVideo === 'function') {
                            playerRegistry[playerId].pauseVideo();
                        }
                    }
                });
            }, { root: feed, threshold: 0.6 });

            document.querySelectorAll('.video-container').forEach(el => observer.observe(el));
        }

        /* ==========================================================================
           4. DIARY VAULT LOGIC
           ========================================================================== */
        function toggleDiary() {
            const modal = document.getElementById('diary-modal');
            if(modal.classList.contains('open')) {
                saveDiaryData();
                modal.classList.remove('open');
                setTimeout(() => { modal.style.display = 'none'; }, 300);
                // Resume video
                if(currentlyPlayingId && playerRegistry[currentlyPlayingId]) {
                    playerRegistry[currentlyPlayingId].playVideo();
                }
            } else {
                modal.style.display = 'flex';
                setTimeout(() => { modal.classList.add('open'); }, 10);
                // Pause video while writing
                if(currentlyPlayingId && playerRegistry[currentlyPlayingId]) {
                    playerRegistry[currentlyPlayingId].pauseVideo();
                }
            }
        }

        function addEmoji(emoji) {
            const textarea = document.getElementById('diary-notes');
            textarea.value += emoji;
            textarea.focus();
        }

        function uploadDiaryImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('diary-img').src = e.target.result;
                    localStorage.setItem('vibez_profile_img', e.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        function saveDiaryData() {
            const notes = document.getElementById('diary-notes').value;
            const name = document.getElementById('diary-name').value;
            localStorage.setItem('vibez_notes', notes);
            localStorage.setItem('vibez_name', name);
        }

        function loadDiaryData() {
            const savedNotes = localStorage.getItem('vibez_notes');
            const savedName = localStorage.getItem('vibez_name');
            const savedImg = localStorage.getItem('vibez_profile_img');
            
            if(savedNotes) document.getElementById('diary-notes').value = savedNotes;
            if(savedName) document.getElementById('diary-name').value = savedName;
            if(savedImg) document.getElementById('diary-img').src = savedImg;
        }

        /* ==========================================================================
           5. QUIZ CHECKPOINT ENGINE
           ========================================================================== */
        function launchInterceptorQuiz() {
            isInterceptorActive = true;
            if (currentlyPlayingId && playerRegistry[currentlyPlayingId]) {
                playerRegistry[currentlyPlayingId].pauseVideo();
            }

            document.getElementById('feed-container').classList.add('no-scroll');

            let quizObj = activeQuizPool.length > 0 
                ? activeQuizPool.splice(Math.floor(Math.random() * activeQuizPool.length), 1)[0]
                : { q: "You've answered all questions. Keep pushing forward.", opts: ["Let's Go"], ans: 0, exp: "Persistence is key." };

            document.getElementById('quiz-q-text').innerText = quizObj.q;
            const btnBox = document.getElementById('quiz-options-container');
            btnBox.innerHTML = '';
            document.getElementById('quiz-explanation').style.display = 'none';
            document.getElementById('continue-scroll-btn').style.display = 'none';

            quizObj.opts.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = optText;
                btn.onclick = () => validateAnswer(btn, index, quizObj);
                btnBox.appendChild(btn);
            });

            const modal = document.getElementById('quiz-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('open'), 40);
        }

        function validateAnswer(btnElement, selectedIdx, quizObj) {
            const buttons = document.querySelectorAll('.quiz-btn');
            buttons.forEach(b => b.style.pointerEvents = 'none');

            if (selectedIdx === quizObj.ans) {
                btnElement.classList.add('correct');
                
                const sfx = document.getElementById('success-sound');
                sfx.volume = 0.9; sfx.currentTime = 0; 
                sfx.play().catch(e=>console.log("Audio play blocked by browser policy"));

                triggerConfetti();

                setTimeout(() => {
                    document.getElementById('exp-text-content').innerText = quizObj.exp;
                    document.getElementById('quiz-explanation').style.display = 'block';
                    document.getElementById('continue-scroll-btn').style.display = 'block';
                }, 500);
            } else {
                btnElement.classList.add('wrong');
                setTimeout(() => {
                    btnElement.classList.remove('wrong');
                    buttons.forEach(b => b.style.pointerEvents = 'auto');
                }, 450);
            }
        }

        function resumeScrolling() {
            const modal = document.getElementById('quiz-modal');
            modal.classList.remove('open');
            setTimeout(() => {
                modal.style.display = 'none';
                document.getElementById('feed-container').classList.remove('no-scroll');
                isInterceptorActive = false;
                if (currentlyPlayingId && playerRegistry[currentlyPlayingId]) {
                    playerRegistry[currentlyPlayingId].playVideo();
                }
                document.getElementById('confetti-canvas').style.display = 'none';
            }, 350);
        }

        /* ==========================================================================
           6. INTERACTIONS (Double Tap & Confetti)
           ========================================================================== */
        function initDoubleTapLike() {
            const feed = document.getElementById('feed-container');
            let lastTap = 0;

            // Touch support
            feed.addEventListener('touchstart', (e) => {
                // Ignore clicks on buttons/inputs
                if(e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) return;

                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    const rect = e.target.getBoundingClientRect();
                    const x = e.touches[0].clientX;
                    const y = e.touches[0].clientY;
                    spawnHeart(x, y, feed);
                    
                    const overlay = e.target.closest('.video-container')?.querySelector('.like-btn');
                    if(overlay) overlay.classList.add('liked');
                    e.preventDefault();
                }
                lastTap = currentTime;
            });
            
            // Mouse support
            feed.addEventListener('dblclick', (e) => {
                const x = e.clientX;
                const y = e.clientY + feed.scrollTop; // Adjust for scroll position
                spawnHeart(x, y, feed);
                const overlay = e.target.closest('.video-container')?.querySelector('.like-btn');
                if(overlay) overlay.classList.add('liked');
            });
        }

        function spawnHeart(x, y, parent) {
            const heart = document.createElement('i');
            heart.className = 'fas fa-heart floating-heart';
            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;
            parent.appendChild(heart);
            setTimeout(() => heart.remove(), 900);
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#00ffcc', '#00e676', '#ff007f', '#f1c40f', '#ffffff'];

            for (let i = 0; i < 110; i++) {
                particles.push({
                    x: canvas.width / 2, y: canvas.height / 2,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 18 - 9,
                    dy: Math.random() * -18 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10
                });
            }

            let frame;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                particles.forEach(p => {
                    p.dy += 0.4; // Gravity
                    p.x += p.dx; p.y += p.dy; p.tilt += 0.1;
                    if (p.y < canvas.height) active = true;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                });
                
                if (active) frame = requestAnimationFrame(render);
                else cancelAnimationFrame(frame);
            }
            render();
        }
    </script>
</body>
</html>

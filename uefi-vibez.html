<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeZ | Immersive Cinematic Feed</title>
    
    <!-- External Libraries: FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel:wght@600;800&family=Outfit:wght@300;400;600;800&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. CORE ARCHITECTURE & CSS VARIABLES
           ========================================================================== */
        :root {
            --brand-cyan: #00ffcc;
            --brand-magenta: #ff007f;
            --brand-glow: rgba(0, 255, 204, 0.4);
            --bg-deep: #050505;
            --danger: #ff2a5f;
            --success: #00e676;
            --text-main: #ffffff;
            --font-art: 'Syne', sans-serif;
            --font-ui: 'Outfit', sans-serif;
            --font-handwriting: 'Caveat', cursive;
            --font-classic: 'Cinzel', serif;
            
            /* Diary Book Palette */
            --parchment: #fcf8ec;
            --parchment-dark: #ebd9b8;
            --ink: #1a1512;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            height: 100vh; width: 100vw;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden; 
            cursor: none; /* Custom laser cursor active */
        }

        /* ==========================================================================
           2. MULTI-COLOR LASER CURSOR ENGINE
           ========================================================================== */
        .laser-cursor {
            position: fixed;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px currentColor, 0 0 24px currentColor, 0 0 36px currentColor;
            transition: width 0.1s, height: 0.1s;
            mix-blend-mode: screen;
        }

        .laser-trail {
            position: fixed;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            opacity: 0.65;
            box-shadow: 0 0 8px currentColor;
        }

        /* ==========================================================================
           3. FULL-SCREEN CLEAN SHORTS CONTAINER (No Dead Dark Space)
           ========================================================================== */
        .full-viewport-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           4. LEFT-CORNER NAVIGATION (Glass Frame Only)
           ========================================================================== */
        .left-corner-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 40;
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            max-height: 85vh;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .left-corner-nav::-webkit-scrollbar { display: none; }

        .nav-item {
            font-family: var(--font-art);
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 9px 14px;
            border-radius: 8px;
            white-space: nowrap;
        }
        .nav-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }
        .nav-item.active {
            color: #000;
            background: var(--brand-cyan);
            transform: scale(1.03);
            box-shadow: 0 0 18px var(--brand-cyan);
        }

        /* ==========================================================================
           5. FULL-BLEED VIDEO FEED (Clean Shorts Format)
           ========================================================================== */
        .feed-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            position: relative;
            z-index: 10;
        }
        .feed-container.no-scroll { overflow-y: hidden !important; }
        
        .video-container {
            position: relative;
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .yt-placeholder {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(10px);
            opacity: 0.4;
            z-index: 1;
        }
        
        .yt-iframe-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .yt-iframe {
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            transform: scale(1.3); /* Fills screen completely without black letterboxing */
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* Clean gradient overlay for text readability - NO global heavy blur */
        .ui-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 12;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 35%, transparent 70%);
            pointer-events: none;
        }
        .ui-overlay > * { pointer-events: auto; }

        /* ==========================================================================
           6. TIKTOK SIDE ACTIONS & CREATOR INFO
           ========================================================================== */
        .side-actions {
            position: absolute;
            bottom: 45px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            z-index: 20;
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.8));
            transition: transform 0.2s;
        }
        .action-btn i { font-size: 34px; margin-bottom: 5px; transition: 0.3s; }
        .action-btn:active i { transform: scale(0.75); }
        .action-btn.liked i { color: var(--danger); animation: heartBurst 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .diary-btn i { color: #f1c40f; text-shadow: 0 0 12px rgba(241, 196, 15, 0.6); }
        .action-text { font-size: 13px; font-weight: 700; text-shadow: 1px 1px 3px #000; }

        .profile-pic-container {
            position: relative;
            margin-bottom: 8px;
        }
        .profile-pic {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid #fff; 
            background: url('https://images.unsplash.com/photo-1511367461989-f85a21fda167?auto=format&fit=crop&w=200&q=80') center/cover;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
        }
        .profile-pic-container::after {
            content: '+';
            position: absolute;
            bottom: -5px; left: 50%;
            transform: translateX(-50%);
            background: var(--danger);
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; font-weight: bold;
            border: 2px solid #fff;
        }

        .bottom-info {
            position: absolute;
            bottom: 35px;
            left: 25px;
            width: 65%;
            z-index: 20;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
        }
        .creator-name {
            font-family: var(--font-art);
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .verified-badge { color: var(--brand-cyan); font-size: 16px; }
        .video-desc {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 12px;
            color: #f0f0f5;
        }
        .tags { font-weight: 700; color: var(--brand-cyan); }
        .music-ticker {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(15, 15, 15, 0.65);
            padding: 7px 14px;
            border-radius: 20px;
            width: fit-content;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
        }
        .music-ticker i { animation: spin 4s linear infinite; }

        /* ==========================================================================
           7. ENLARGED NOTEBOOK DIARY MODAL (Handwriting Font & Square Photo)
           ========================================================================== */
        .diary-modal {
            position: absolute;
            top: 100%; left: 0;
            width: 100vw; height: 100vh;
            background: var(--parchment);
            z-index: 200;
            transition: top 0.55s cubic-bezier(0.86, 0, 0.07, 1);
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.18);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.5), rgba(0,0,0,0.03)),
                url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23n)" opacity="0.05"/></svg>');
        }
        .diary-modal.open { top: 0; }

        .diary-header {
            padding: 30px 40px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 3px solid var(--parchment-dark);
            position: relative;
        }
        .close-diary {
            position: absolute;
            top: 25px; right: 35px;
            font-size: 30px;
            color: var(--ink);
            cursor: pointer;
            opacity: 0.8;
            transition: transform 0.2s;
        }
        .close-diary:hover { transform: scale(1.1); }
        
        .diary-profile-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 12px;
        }
        .diary-profile-pic {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 10px; /* Clean square frame */
            border: 3.5px solid var(--ink);
            box-shadow: 5px 5px 15px rgba(0,0,0,0.25);
            cursor: pointer;
        }
        .feather-decor {
            position: absolute;
            color: var(--ink);
            font-size: 40px;
            opacity: 0.8;
            pointer-events: none;
        }
        .feather-left { top: 30px; left: -38px; transform: rotate(-35deg); }
        .feather-right { top: 30px; right: -38px; transform: rotate(35deg) scaleX(-1); }

        .diary-name-input {
            background: transparent;
            border: none;
            text-align: center;
            font-family: var(--font-classic);
            font-size: 24px;
            font-weight: 800;
            color: var(--ink);
            outline: none;
            width: 50%;
            border-bottom: 2px dashed rgba(26, 21, 18, 0.35);
            padding-bottom: 4px;
        }

        /* Lined Notebook Body with Clear Handwriting Font */
        .diary-body {
            flex: 1;
            padding: 25px 50px;
            position: relative;
            background: repeating-linear-gradient(
                transparent, transparent 38px, 
                rgba(26, 21, 18, 0.15) 38px, rgba(26, 21, 18, 0.15) 39px
            );
        }
        .gothic-textarea {
            width: 100%; height: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            font-family: var(--font-handwriting); /* Gorgeous legible handwriting font */
            font-size: 30px; 
            font-weight: 700;
            color: var(--ink);
            line-height: 39px; /* Aligns perfectly with notebook lines */
            padding-top: 2px;
        }
        .gothic-textarea::placeholder { color: rgba(26, 21, 18, 0.35); }

        .emoji-bar {
            background: rgba(235, 217, 184, 0.92);
            padding: 18px;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-top: 3px solid var(--ink);
            backdrop-filter: blur(8px);
        }
        .emoji-btn {
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.2s;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
        }
        .emoji-btn:active { transform: scale(0.75); }

        /* ==========================================================================
           8. CHECKPOINT QUIZ MODAL
           ========================================================================== */
        .quiz-modal {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 150;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .quiz-modal.active { display: flex; opacity: 1; }
        .quiz-glow {
            position: absolute; width: 320px; height: 320px;
            background: radial-gradient(circle, var(--brand-glow) 0%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: -1;
        }
        .quiz-title { font-family: var(--font-art); color: var(--brand-cyan); font-size: 34px; margin-bottom: 6px; font-weight: 800; }
        .quiz-subtitle { color: #fff; font-weight: 400; margin-bottom: 30px; font-size: 15px; opacity: 0.7; }
        .quiz-question { font-size: 22px; font-weight: 600; margin-bottom: 25px; line-height: 1.4; max-width: 580px; }
        .quiz-options { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 14px; }
        .quiz-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 18px 22px;
            font-size: 16px; font-family: var(--font-ui); font-weight: 600;
            border-radius: 14px; cursor: pointer; transition: all 0.2s;
            text-align: left;
        }
        .quiz-btn:hover { background: rgba(255, 255, 255, 0.09); }
        .quiz-btn.correct { background: var(--success); color: #000; border-color: var(--success); box-shadow: 0 0 20px rgba(0,230,118,0.5); }
        .quiz-btn.wrong { background: var(--danger); color: #fff; border-color: var(--danger); animation: shake 0.4s; }

        .explanation-box {
            display: none; margin-top: 25px;
            background: rgba(0, 255, 204, 0.08);
            border-left: 4px solid var(--brand-cyan);
            padding: 18px; border-radius: 0 10px 10px 0;
            text-align: left; max-width: 520px;
            animation: slideUpFade 0.4s forwards;
        }
        .exp-title { font-family: var(--font-art); font-weight: 800; color: var(--brand-cyan); margin-bottom: 6px; font-size: 16px; }
        .exp-text { font-size: 15px; line-height: 1.5; }
        
        .continue-btn {
            display: none; margin-top: 25px;
            background: #fff; color: #000;
            padding: 15px 35px; font-family: var(--font-art); font-weight: 800;
            border-radius: 35px; border: none; font-size: 17px; cursor: pointer;
            box-shadow: 0 4px 18px rgba(255,255,255,0.35); transition: transform 0.2s;
        }
        .continue-btn:active { transform: scale(0.92); }

        /* ==========================================================================
           9. ANIMATIONS & EFFECTS
           ========================================================================== */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes heartBurst { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); } 75% { transform: translateX(-10px); }
        }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .floating-heart {
            position: absolute; color: var(--danger); font-size: 75px;
            pointer-events: none; z-index: 50; transform: translate(-50%, -50%) scale(0);
            animation: floatUp 0.9s ease-out forwards; filter: drop-shadow(0 0 15px rgba(255,42,95,0.8));
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            25% { transform: translate(-50%, -50%) scale(1.2) rotate(-10deg); }
            100% { transform: translate(-50%, -200px) scale(1) rotate(15deg); opacity: 0; }
        }
        
        #confetti-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 180; display: none;
        }
    </style>
</head>
<body>

    <!-- Dynamic Laser Cursor -->
    <div class="laser-cursor" id="laser-cursor"></div>
    <div class="laser-trail" id="laser-trail"></div>

    <!-- Success Sound Audio Element -->
    <audio id="success-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>

    <!-- FULL SCREEN SHORTS CONTAINER -->
    <div class="full-viewport-container">
        
        <!-- Left Corner Navigation -->
        <div class="left-corner-nav" id="left-corner-nav"></div>

        <!-- Scrollable Feed -->
        <div class="feed-container" id="feed-container"></div>

        <!-- Checkpoint Quiz Interceptor -->
        <div class="quiz-modal" id="quiz-modal">
            <div class="quiz-glow"></div>
            <div class="quiz-title">Knowledge Checkpoint</div>
            <div class="quiz-subtitle">Prove you are mastering the feed, not just swiping.</div>
            <div class="quiz-question" id="quiz-q-text">Loading...</div>
            
            <div class="quiz-options" id="quiz-options-container"></div>

            <div class="explanation-box" id="quiz-explanation">
                <div class="exp-title">The Blueprint:</div>
                <div class="exp-text" id="exp-text-content"></div>
            </div>

            <button class="continue-btn" id="continue-scroll-btn" onclick="resumeScrolling()">Unlock Feed</button>
        </div>

        <!-- ENLARGED NOTEBOOK DIARY MODAL -->
        <div class="diary-modal" id="diary-modal">
            <div class="diary-header">
                <i class="fas fa-times close-diary" onclick="toggleDiary()"></i>
                <div class="diary-profile-wrapper">
                    <i class="fas fa-feather-alt feather-decor feather-left"></i>
                    <i class="fas fa-feather-alt feather-decor feather-right"></i>
                    
                    <img src="https://images.unsplash.com/photo-1511367461989-f85a21fda167?auto=format&fit=crop&w=200&q=80" 
                         id="diary-img" class="diary-profile-pic" onclick="document.getElementById('img-upload').click()">
                    <input type="file" id="img-upload" style="display:none" accept="image/*" onchange="uploadDiaryImage(event)">
                </div>
                <input type="text" class="diary-name-input" id="diary-name" placeholder="Enter Thy Name..." value="Master Scholar">
            </div>
            
            <div class="diary-body">
                <textarea class="gothic-textarea" id="diary-notes" placeholder="Scribe thy thoughts, reflections, and brilliance here..."></textarea>
            </div>

            <div class="emoji-bar">
                <div class="emoji-btn" onclick="addEmoji('💀')">💀</div>
                <div class="emoji-btn" onclick="addEmoji('🔥')">🔥</div>
                <div class="emoji-btn" onclick="addEmoji('🐐')">🐐</div>
                <div class="emoji-btn" onclick="addEmoji('📈')">📈</div>
                <div class="emoji-btn" onclick="addEmoji('🧠')">🧠</div>
                <div class="emoji-btn" onclick="addEmoji('💸')">💸</div>
                <div class="emoji-btn" onclick="addEmoji('⚡')">⚡</div>
            </div>
        </div>

        <!-- Confetti Overlay -->
        <canvas id="confetti-canvas"></canvas>

    </div>

    <!-- YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>

                videos: ["KHAOa2HrNTw", "3cSEEbwGKGk", "aYgA6cIzqm8", "7GBm5rbr50U", "mxb2sBLNK5Y", "9CRB8FTsErs", "txkwg5f37ws", "hlXD_AXtSIY","s1a0NNaTbag","uYKhyFr3Bns","5nHlY2frPvc","zNPYkAWy03g","BpPoBNzeBHs","o2tz6bBznxU","cld-pL5bHzs","tIeWJjihTLU","X2cEvpFoaKQ","07QijAtvWYQ".],
                quizzes: [
                    { q: "What is the primary danger of constant unearned dopamine loops?", opts: ["They raise your baseline, making hard work feel impossible", "They improve your attention span", "They burn computer screens"], ans: 0, exp: "Endless scrolling destroys your dopamine receptors. Protect your focus." }
                ]
            }
        };

        /* ==========================================================================
           2. STATE & MULTI-COLOR LASER CURSOR
           ========================================================================== */
        let currentCategory = "FACTS";
        let activeQuizPool = [];
        let isInterceptorActive = false;
        let videosWatched = 0; 
        
        let playerRegistry = {};
        let currentlyPlayingId = null;

        const laserColors = ['#00ffcc', '#ff007f', '#00e676', '#f1c40f', '#3498db', '#9b59b6'];
        let colorIdx = 0;

        document.addEventListener('mousemove', (e) => {
            const cursor = document.getElementById('laser-cursor');
            const trail = document.getElementById('laser-trail');
            
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
            
            setTimeout(() => {
                trail.style.left = `${e.clientX}px`;
                trail.style.top = `${e.clientY}px`;
            }, 40);

            if(Math.random() < 0.12) {
                colorIdx = (colorIdx + 1) % laserColors.length;
                const col = laserColors[colorIdx];
                cursor.style.color = col;
                trail.style.color = col;
            }
        });

        /* ==========================================================================
           3. INITIALIZATION
           ========================================================================== */
        function initApp() {
            renderLeftNav();
            loadCategoryData(currentCategory);
            setupIntersectionObserver();
            initDoubleTapLike();
            loadDiaryData();
        }

        /* ==========================================================================
           4. NAVIGATION RENDERING
           ========================================================================== */
        function renderLeftNav() {
            const nav = document.getElementById('left-corner-nav');
            nav.innerHTML = '';
            Object.keys(UEFI_DATABASE).forEach(cat => {
                const item = document.createElement('div');
                item.className = `nav-item ${cat === currentCategory ? 'active' : ''}`;
                item.innerText = cat;
                item.onclick = () => {
                    if(currentCategory === cat) return;
                    currentCategory = cat;
                    videosWatched = 0;
                    renderLeftNav();
                    loadCategoryData(cat);
                };
                nav.appendChild(item);
            });
        }

        function loadCategoryData(catKey) {
            const feed = document.getElementById('feed-container');
            feed.innerHTML = '';
            
            Object.values(playerRegistry).forEach(p => {
                if(p && typeof p.destroy === 'function') p.destroy();
            });
            playerRegistry = {};
            activeQuizPool = [...UEFI_DATABASE[catKey].quizzes];

            const vids = UEFI_DATABASE[catKey].videos;
            
            vids.forEach((videoId, idx) => {
                const container = document.createElement('div');
                container.className = 'video-container';
                container.id = `container-${videoId}-${idx}`;
                
                const likes = Math.floor(Math.random() * 750) + 110;
                const comments = Math.floor(Math.random() * 75) + 12;
                
                container.innerHTML = `
                    <div class="yt-placeholder" style="background-image: url('https://img.youtube.com/vi/${videoId}/hqdefault.jpg');"></div>
                    <div class="yt-iframe-wrapper" id="player-wrapper-${videoId}-${idx}">
                        <div id="player-${videoId}-${idx}" class="yt-iframe"></div>
                    </div>
                    
                    <div class="ui-overlay" data-idx="${idx}">
                        <div class="side-actions">
                            <div class="profile-pic-container">
                                <div class="profile-pic"></div>
                            </div>
                            <div class="action-btn like-btn">
                                <i class="fas fa-heart"></i>
                                <span class="action-text">${likes}K</span>
                            </div>
                            <div class="action-btn">
                                <i class="fas fa-comment-dots"></i>
                                <span class="action-text">${comments}K</span>
                            </div>
                            <div class="action-btn diary-btn" onclick="toggleDiary()">
                                <i class="fas fa-book"></i>
                                <span class="action-text">Diary</span>
                            </div>
                            <div class="action-btn">
                                <i class="fas fa-share"></i>
                                <span class="action-text">Share</span>
                            </div>
                        </div>
                        <div class="bottom-info">
                            <div class="creator-name">@VibeZ <i class="fas fa-check-circle verified-badge"></i></div>
                            <div class="video-desc">Master your craft daily. <span class="tags">#${catKey.toLowerCase()} #vibeZ</span></div>
                            <div class="music-ticker"><i class="fas fa-compact-disc"></i> Original Audio - VibeZ Vault</div>
                        </div>
                    </div>
                `;
                feed.appendChild(container);
            });
            feed.scrollTop = 0;
        }

        /* ==========================================================================
           5. LAZY LOADING & VIDEO OBSERVER
           ========================================================================== */
        function setupIntersectionObserver() {
            const feed = document.getElementById('feed-container');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const containerId = entry.target.id;
                    const parts = containerId.split('-');
                    const videoId = parts[1];
                    const idx = parts[2];
                    const playerId = `player-${videoId}-${idx}`;
                    const wrapperId = `player-wrapper-${videoId}-${idx}`;

                    if (entry.isIntersecting) {
                        if (!playerRegistry[playerId]) {
                            playerRegistry[playerId] = new YT.Player(playerId, {
                                videoId: videoId,
                                playerVars: {
                                    'autoplay': 1, 'controls': 0, 'rel': 0, 'showinfo': 0, 
                                    'modestbranding': 1, 'loop': 1, 'playlist': videoId,
                                    'playsinline': 1, 'mute': 0 
                                },
                                events: {
                                    'onReady': (e) => {
                                        const wrapper = document.querySelector(`#${wrapperId} .yt-iframe`);
                                        if(wrapper) wrapper.style.opacity = '1';
                                        e.target.playVideo();
                                    }
                                }
                            });
                        } else {
                            if(typeof playerRegistry[playerId].playVideo === 'function'){
                                playerRegistry[playerId].playVideo();
                            }
                        }
                        
                        currentlyPlayingId = playerId;
                        videosWatched++;
                        
                        if (videosWatched > 1 && (videosWatched - 1) % 3 === 0 && !isInterceptorActive) {
                            setTimeout(() => launchInterceptorQuiz(), 1000); 
                        }

                    } else {
                        if (playerRegistry[playerId] && typeof playerRegistry[playerId].pauseVideo === 'function') {
                            playerRegistry[playerId].pauseVideo();
                        }
                    }
                });
            }, { root: feed, threshold: 0.6 });

            const mutObserver = new MutationObserver(() => {
                document.querySelectorAll('.video-container').forEach(el => observer.observe(el));
            });
            mutObserver.observe(feed, { childList: true });
        }

        /* ==========================================================================
           6. DIARY VAULT LOGIC
           ========================================================================== */
        function toggleDiary() {
            const modal = document.getElementById('diary-modal');
            if(modal.classList.contains('open')) {
                saveDiaryData();
                modal.classList.remove('open');
                if(currentlyPlayingId && playerRegistry[currentlyPlayingId]) {
                    playerRegistry[currentlyPlayingId].playVideo();
                }
            } else {
                if(currentlyPlayingId && playerRegistry[currentlyPlayingId]) {
                    playerRegistry[currentlyPlayingId].pauseVideo();
                }
                modal.classList.add('open');
            }
        }

        function addEmoji(emoji) {
            const textarea = document.getElementById('diary-notes');
            textarea.value += emoji;
            textarea.focus();
        }

        function uploadDiaryImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('diary-img').src = e.target.result;
                    localStorage.setItem('vibez_profile_img', e.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        function saveDiaryData() {
            const notes = document.getElementById('diary-notes').value;
            const name = document.getElementById('diary-name').value;
            localStorage.setItem('vibez_notes', notes);
            localStorage.setItem('vibez_name', name);
        }

        function loadDiaryData() {
            const savedNotes = localStorage.getItem('vibez_notes');
            const savedName = localStorage.getItem('vibez_name');
            const savedImg = localStorage.getItem('vibez_profile_img');
            
            if(savedNotes) document.getElementById('diary-notes').value = savedNotes;
            if(savedName) document.getElementById('diary-name').value = savedName;
            if(savedImg) document.getElementById('diary-img').src = savedImg;
        }

        /* ==========================================================================
           7. QUIZ CHECKPOINT ENGINE
           ========================================================================== */
        function launchInterceptorQuiz() {
            isInterceptorActive = true;
            if (currentlyPlayingId && playerRegistry[currentlyPlayingId]) {
                playerRegistry[currentlyPlayingId].pauseVideo();
            }

            document.getElementById('feed-container').classList.add('no-scroll');

            let quizObj = activeQuizPool.length > 0 
                ? activeQuizPool.splice(Math.floor(Math.random() * activeQuizPool.length), 1)[0]
                : { q: "Information without execution is useless. What is your immediate next step?", opts: ["Apply what I learned", "Keep scrolling endlessly", "Close the app"], ans: 0, exp: "Action is the ultimate currency. Scribe your plan into your Diary." };

            document.getElementById('quiz-q-text').innerText = quizObj.q;
            const btnBox = document.getElementById('quiz-options-container');
            btnBox.innerHTML = '';
            document.getElementById('quiz-explanation').style.display = 'none';
            document.getElementById('continue-scroll-btn').style.display = 'none';

            quizObj.opts.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = optText;
                btn.onclick = () => validateAnswer(btn, index, quizObj);
                btnBox.appendChild(btn);
            });

            const modal = document.getElementById('quiz-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.style.opacity = '1', 40);
        }

        function validateAnswer(btnElement, selectedIdx, quizObj) {
            const buttons = document.querySelectorAll('.quiz-btn');
            buttons.forEach(b => b.style.pointerEvents = 'none');

            if (selectedIdx === quizObj.ans) {
                btnElement.classList.add('correct');
                
                const sfx = document.getElementById('success-sound');
                sfx.volume = 0.9; sfx.currentTime = 0; 
                sfx.play().catch(e=>console.log("Audio play blocked"));

                triggerConfetti();

                setTimeout(() => {
                    document.getElementById('exp-text-content').innerText = quizObj.exp;
                    document.getElementById('quiz-explanation').style.display = 'block';
                    document.getElementById('continue-scroll-btn').style.display = 'block';
                }, 500);
            } else {
                btnElement.classList.add('wrong');
                setTimeout(() => {
                    btnElement.classList.remove('wrong');
                    buttons.forEach(b => b.style.pointerEvents = 'auto');
                }, 450);
            }
        }

        function resumeScrolling() {
            const modal = document.getElementById('quiz-modal');
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.style.display = 'none';
                document.getElementById('feed-container').classList.remove('no-scroll');
                isInterceptorActive = false;
                if (currentlyPlayingId && playerRegistry[currentlyPlayingId]) {
                    playerRegistry[currentlyPlayingId].playVideo();
                }
                document.getElementById('confetti-canvas').style.display = 'none';
            }, 350);
        }

        /* ==========================================================================
           8. INTERACTIONS & CONFETTI
           ========================================================================== */
        function initDoubleTapLike() {
            const feed = document.getElementById('feed-container');
            let lastTap = 0;

            feed.addEventListener('touchstart', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    const rect = e.target.getBoundingClientRect();
                    const x = e.touches[0].clientX - rect.left;
                    const y = e.touches[0].clientY - rect.top;
                    spawnHeart(x, y, feed);
                    
                    const overlay = e.target.closest('.ui-overlay');
                    if(overlay) overlay.querySelector('.like-btn').classList.add('liked');
                    e.preventDefault();
                }
                lastTap = currentTime;
            });
            
            feed.addEventListener('dblclick', (e) => {
                const rect = e.target.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                spawnHeart(x, y, feed);
                const overlay = e.target.closest('.ui-overlay');
                if(overlay) overlay.querySelector('.like-btn').classList.add('liked');
            });
        }

        function spawnHeart(x, y, parent) {
            const heart = document.createElement('i');
            heart.className = 'fas fa-heart floating-heart';
            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;
            parent.appendChild(heart);
            setTimeout(() => heart.remove(), 900);
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#00ffcc', '#00e676', '#ff007f', '#f1c40f', '#ffffff'];

            for (let i = 0; i < 110; i++) {
                particles.push({
                    x: canvas.width / 2, y: canvas.height / 2,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 18 - 9,
                    dy: Math.random() * -18 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10
                });
            }

            let frame;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                particles.forEach(p => {
                    p.dy += 0.4;
                    p.x += p.dx; p.y += p.dy; p.tilt += 0.1;
                    if (p.y < canvas.height) active = true;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                });
                
                if (active) frame = requestAnimationFrame(render);
                else cancelAnimationFrame(frame);
            }
            render();
        }

        window.onYouTubeIframeAPIReady = function() {
            initApp();
        };
    </script>
